[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustdive"
version = "0.1.0"
description = "Reference-adaptive diving assessment with counterfactual phase evidence"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<0.15",
  "PyYAML>=6,<7",
  "Pillow>=10,<12",
  "tqdm>=4.66,<5",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<0.14",
  "timm>=1.0,<2",
  "transformers>=4.48,<5",
  "socksio>=1.0,<2",
]

[project.optional-dependencies]
gpu = ["pytorchvideo>=0.1.5", "fvcore>=0.1.5", "iopath>=0.1.10"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
